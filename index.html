<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אפליקציית שותפים – אב-טיפוס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --ink:#1b2232; --muted:#667085; --line:#e3e7ef;
  --brand:#3b5bdb; --brand-ink:#ffffff; --brand-soft:#e8edff;
  --ok:#2b8a3e; --ok-soft:#e6f6ea; --warn:#d9480f; --warn-soft:#fff0e6;
  --danger:#c92a2a; --danger-soft:#ffe9e9; --ai:#6741d9; --ai-soft:#f1ecff;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#dfe4ee;color:var(--ink);font-family:"Rubik",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px;box-shadow:0 0 40px rgba(0,0,0,.08)}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:12px 16px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1;min-width:0}
.demo-badge{font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:99px;white-space:nowrap}
header.top select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:4px 6px;font-size:13px}
header.top select option{color:var(--ink)}
.icon-btn{background:none;border:0;color:inherit;cursor:pointer;padding:4px;display:inline-flex;border-radius:10px}
.icon-btn:hover{background:rgba(255,255,255,.15)}
main{padding:16px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select.in,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.ai{background:var(--ai-soft);color:var(--ai)}
.pill.gray{background:#eef0f4;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--bg);border-radius:12px;padding:8px 4px}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.pos{color:var(--ok)} .neg{color:var(--danger)}
.transfer{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:12px;margin-top:6px}
.transfer .arrow{color:var(--muted)}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.note{font-size:13px;background:var(--warn-soft);color:#8a3a0a;border-radius:12px;padding:8px 12px;margin-bottom:12px}
.note.info{background:var(--brand-soft);color:#24398f}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ ";color:var(--brand)}
details[open] summary::before{content:"－ "}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
.task{display:flex;gap:10px;align-items:center}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;flex:none;display:grid;place-items:center;color:#fff}
.check.on{background:var(--ok);border-color:var(--ok)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.steps{display:flex;gap:4px;margin-top:8px}
.steps span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps span.on{background:var(--brand)}
.steps.closed span.on{background:var(--ok)}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:360px}
.chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;background:#fff;box-shadow:var(--shadow);align-self:flex-end}
.msg.me{align-self:flex-start;background:var(--brand);color:#fff}
.msg.ai{background:var(--ai-soft);color:#2c1a6b;box-shadow:none;border:1px solid #e0d6ff}
.msg .who{font-size:11px;font-weight:600;opacity:.75;margin-bottom:2px}
.msg .time{font-size:10px;opacity:.6;margin-top:2px}
.msg.sys{align-self:center;background:transparent;box-shadow:none;color:var(--muted);font-size:12px;text-align:center}
.proposal{border:1px dashed var(--ai);border-radius:12px;padding:10px;background:#fff;margin-top:6px;color:var(--ink)}
.chat-form{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.chat-form input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--brand);color:var(--brand)}
/* listing */
.listing .score{font-size:22px;font-weight:700;color:var(--brand)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--brand)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
/* toggle */
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cfd5e1;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span::after{right:23px}
.switch input:focus-visible+span{outline:2px solid var(--brand)}
/* nav */
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;text-align:center;padding:8px 2px 10px;color:var(--muted);text-decoration:none;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom a.on{color:var(--brand);font-weight:600}
nav.bottom svg{width:22px;height:22px}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(20,26,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(430px,100%);max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px 24px}
.toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 32px));z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1b2232;color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .25s ease-out}
.toast b{display:block;font-size:12px;opacity:.7;font-weight:500}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
/* auth */
.hero{padding:40px 8px 20px;text-align:center}
.hero .logo{width:64px;height:64px;border-radius:20px;background:var(--brand);display:inline-grid;place-items:center;color:#fff;margin-bottom:12px}
.role-card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;background:#fff;border:2px solid transparent;border-radius:var(--radius);padding:16px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow)}
.role-card:hover{border-color:var(--brand)}
.role-card .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.role-card.soon{opacity:.95}
kbd{font-family:inherit;background:var(--bg);padding:0 6px;border-radius:6px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;font-weight:500}
a.btn{text-decoration:none;text-align:center;display:inline-block}
/* virtual tour */
.tour-stage{position:relative;aspect-ratio:4/3;max-height:62vh;min-height:240px;width:100%;border-radius:18px;overflow:hidden;background:#15181d;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.tour-stage.grabbing{cursor:grabbing}
.tour-stage:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.tour-stage:fullscreen{aspect-ratio:auto;max-height:none;height:100%;border-radius:0}
.tour-img{position:absolute;inset:0;background-repeat:no-repeat}
.tour-img.repeat{background-repeat:repeat-x}
.tour-img.enter{animation:walkin .45s ease-out}
@keyframes walkin{from{opacity:.25;transform:scale(1.1)}to{opacity:1;transform:none}}
.tour-top{position:absolute;top:10px;right:10px;left:10px;display:flex;gap:6px;pointer-events:none}
.tour-pill{background:rgba(0,0,0,.55);color:#fff}
.tour-pill.ghosty{background:rgba(255,255,255,.22)}
.tour-ctrl{position:absolute;bottom:10px;right:10px;left:10px;display:flex;gap:8px;align-items:center}
.tour-progress{position:absolute;left:14px;right:14px;bottom:56px}
.tour-progress input{width:100%;accent-color:#fff;margin:0}
.tbtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:17px;cursor:pointer;flex:none}
.tbtn:hover{background:rgba(0,0,0,.78)}
.hotspot{position:absolute;top:60%;transform:translate(-50%,-50%);border:0;background:rgba(255,255,255,.94);color:var(--ink);border-radius:99px;padding:6px 12px 6px 8px;font-weight:600;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap}
.hotspot:hover{background:#fff}
.hotspot .arrow{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:10px;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,91,219,.55)}50%{box-shadow:0 0 0 8px rgba(59,91,219,0)}}
.edge{position:absolute;top:48px;display:flex;flex-direction:column;gap:5px;max-width:46%}
.edge.right{align-items:flex-end}
.edge.left{left:8px}.edge.right{right:8px}
.edge-hint{border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.edge.left .edge-hint::before{content:"◀ "}.edge.right .edge-hint::after{content:" ▶"}
.edge-hint:hover{background:rgba(0,0,0,.78)}
.tour-chips{position:absolute;top:52%;transform:translateY(-50%);left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.tour-chips .hotspot{position:static;transform:none}
.tour-chips .hotspot.glow{outline:3px solid rgba(255,255,255,.7);transform:scale(1.06)}
.tour-hint{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.6);color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;pointer-events:none;white-space:nowrap}
.tour-missing{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#d8dbe2;padding:24px;font-size:14px}
.tour-ph{display:inline-grid;place-items:center;background:var(--bg);color:var(--muted);font-weight:700}
.minimap{width:100%;height:auto;max-height:220px;margin-top:8px;display:block}
.minimap text{font-family:inherit;font-size:13px}
.minimap g:focus-visible rect{stroke:var(--ink);stroke-width:3}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.deal-banner{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);z-index:61;pointer-events:none;background:rgba(255,255,255,.95);color:#1b1f3b;border-radius:18px;padding:16px 26px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:dealpop .5s ease-out;width:max-content;max-width:calc(100% - 32px)}
.deal-banner b{display:block;font-size:1.6rem}
@keyframes dealpop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal"></div>
<canvas id="fx" aria-hidden="true" hidden></canvas>

<script>
/* ============================================================
   אב-טיפוס לחיץ – אפליקציית שותפים, דירות ומשכירים
   כל הנתונים הם נתוני דמה ונשמרים בדפדפן בלבד.
   מודל הנתונים תואם ל-ERD במסמך האפיון.
   ============================================================ */
const KEY = 'roommates-prototype-v1';
const TODAY = new Date();
const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const addDays = (n, from = TODAY) => { const d = new Date(from); d.setDate(d.getDate() + n); return iso(d); };
const monthKey = (d = TODAY) => iso(d).slice(0, 7);
const prevMonthKey = (n) => { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - n, 15); return monthKey(d); };
const firstOfMonth = iso(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
let uid = Date.now();
const newId = p => p + (uid++).toString(36);

function seed() {
  const users = [
    { user_id: 't1', name: 'נועה', email: 'noa@demo', phone: '050-0000001', role: 'Tenant', preferences_json: {} },
    { user_id: 't2', name: 'איתי', email: 'itay@demo', phone: '050-0000002', role: 'Tenant', preferences_json: {} },
    { user_id: 't3', name: 'מאיה', email: 'maya@demo', phone: '050-0000003', role: 'Tenant', preferences_json: {} },
    { user_id: 'l1', name: 'רונית', email: 'ronit@demo', phone: '050-0000010', role: 'Landlord', preferences_json: {} },
    { user_id: 's1', name: 'עמית', email: 'amit@demo', phone: '050-0000020', role: 'Seeker', preferences_json: {} },
  ];
  const apt = 'a1';
  const exp = (by, amount, category, description, d) => ({ expense_id: newId('e'), apartment_id: apt, created_by_user_id: by, amount, category, description, receipt_url: null, billing_period: 1, is_cleared: false, date: d });
  return {
    v: 1,
    session: { logged: false, role: null, user_id: null, name: '' },
    users,
    apartments: [{ apartment_id: apt, address: 'רחוב הדוגמה 12, תל אביב', landlord_id: 'l1', rent_amount: 7200, contract_url: '#', rules_json: { rules: ['ללא עישון בתוך הדירה', 'חיות מחמד באישור המשכירה', 'שקט אחרי 23:00'] }, contract: { start: '2026-09-01', end: '2027-08-31', deposit: 'ערבות בנקאית (דמה)' } }],
    period: { id: 1, start: firstOfMonth },
    expenses: [
      exp('t1', 186.5, 'מזון וקניות', 'קניות סופר שבועיות', addDays(-12)),
      exp('t2', 64, 'חומרי ניקוי', 'אקונומיקה, ספוגים ונוזל כלים', addDays(-9)),
      exp('t3', 120, 'ציוד לבית', 'מגבות מטבח וקולב', addDays(-4)),
      exp('t1', 42, 'מזון וקניות', 'חלב, לחם וקפה', addDays(-2)),
    ],
    history: [
      { period_id: 0, start: prevMonthKey(1) + '-01', end: prevMonthKey(1) + '-31', total: 612, kind: 'monthly', transfers: [{ from: 't3', to: 't1', amount: 84 }, { from: 't2', to: 't1', amount: 32 }] },
    ],
    taskMode: 'Auto', rrIndex: 0,
    tasks: [
      { task_id: 'k1', apartment_id: apt, assigned_to_user_id: 't1', title: 'שטיפת רצפה', due_date: iso(TODAY), status: 'Pending', mode: 'Auto' },
      { task_id: 'k2', apartment_id: apt, assigned_to_user_id: 't2', title: 'הוצאת זבל ומחזור', due_date: iso(TODAY), status: 'Pending', mode: 'Auto' },
      { task_id: 'k3', apartment_id: apt, assigned_to_user_id: 't3', title: 'ניקוי מטבח', due_date: addDays(1), status: 'Pending', mode: 'Auto' },
      { task_id: 'k4', apartment_id: apt, assigned_to_user_id: 't1', title: 'ניקוי שירותים ומקלחת', due_date: addDays(3), status: 'Pending', mode: 'Auto' },
      { task_id: 'k5', apartment_id: apt, assigned_to_user_id: 't2', title: 'השקיית עציצים', due_date: addDays(-1), status: 'Done', mode: 'Auto' },
    ],
    issues: [
      { issue_id: 'i1', apartment_id: apt, reported_by_user_id: 't2', title: 'נזילה מתחת לכיור במטבח', description: 'מטפטף כל הזמן, שמנו דלי בינתיים.', image: null, status: 'Technician', receipt_url: null, date: addDays(-5) },
      { issue_id: 'i2', apartment_id: apt, reported_by_user_id: 't3', title: 'נורה שרופה בחדר המדרגות', description: '', image: null, status: 'Closed', receipt_url: null, date: addDays(-20) },
    ],
    rent: {
      [monthKey()]: { t1: 'paid', t2: 'pending', t3: 'paid' },
      [prevMonthKey(1)]: { t1: 'paid', t2: 'paid', t3: 'paid' },
      [prevMonthKey(2)]: { t1: 'paid', t2: 'paid', t3: 'paid' },
    },
    bills: [
      { bill_id: 'b1', apartment_id: apt, title: 'חשבון מים – חודשיים אחרונים', amount: 340, due_date: addDays(10), file: null, status: 'open' },
    ],
    listings: [
      { listing_id: 'L1', apartment_id: 'a9', publisher_type: 'Landlord', publisher_id: 'l1', publisher_name: 'רונית (משכירה)', title: 'דירת 3 חדרים שלמה, משופצת', area: 'תל אביב', price: 7800, rooms: 3, entry_date: addDays(9), premium: true,
        hard_constraints_json: { smoking: false, pets: true, parking: true }, soft_constraints_json: { price: 7800, entry_date: addDays(9) },
        public_info: { extras: 'ארנונה וועד בית אינם כלולים במחיר.', furniture: 'מרוהטת חלקית: מקרר, מכונת כביסה וארונות.', roommates: 'הדירה מושכרת בשלמותה.', floor: 'קומה 2 עם מעלית.' } },

/* ---------- expenses & settlement ---------- */
function balance() {
  const ts = tenants();
  const exp = state.expenses.filter(e => !e.is_cleared);
  const total = exp.reduce((s, e) => s + e.amount, 0);
  const share = ts.length ? total / ts.length : 0;
  const rows = ts.map(u => { const paid = exp.filter(e => e.created_by_user_id === u.user_id).reduce((s, e) => s + e.amount, 0); return { id: u.user_id, paid, net: paid - share }; });
  return { total, share, rows, transfers: settle(rows) };
}
// Greedy minimal transfers: largest debtor pays largest creditor until both sides are zero.
function settle(rows) {
  const cred = rows.filter(r => r.net > 0.005).map(r => ({ id: r.id, amt: r.net })).sort((a, b) => b.amt - a.amt);
  const debt = rows.filter(r => r.net < -0.005).map(r => ({ id: r.id, amt: -r.net })).sort((a, b) => b.amt - a.amt);
  const out = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const x = Math.min(debt[i].amt, cred[j].amt);
    out.push({ from: debt[i].id, to: cred[j].id, amount: Math.round(x * 100) / 100 });
    debt[i].amt -= x; cred[j].amt -= x;
    if (debt[i].amt < 0.005) i++;
    if (cred[j].amt < 0.005) j++;
  }
  return out;
}
function addExpense({ amount, category, description, payer, date, receipt }) {
  const e = { expense_id: newId('e'), apartment_id: apt().apartment_id, created_by_user_id: payer, amount: Math.round(amount * 100) / 100, category, description, receipt_url: receipt || null, billing_period: state.period.id, is_cleared: false, date: date || iso(TODAY) };
  state.expenses.unshift(e);
  save();
  toast('expense', `הוצאה חדשה של ${user(payer).name}: ${money(e.amount)} – ${category}`, '🔔 נשלחה התראה לשותפים');
  if (e.date < state.period.start) toast(null, 'ההוצאה מתאריך שלפני סגירת התקופה הקודמת, ולכן נרשמה במאזן התקופה הנוכחית. תקופות סגורות לא נפתחות מחדש.', 'הוצאה שנשכחה');
  return e;
}
function closePeriod(kind) {
  const b = balance();
  if (!b.total) { toast(null, 'אין הוצאות פתוחות בתקופה הנוכחית.', 'אין מה לקזז'); return; }
  state.history.unshift({ period_id: state.period.id, start: state.period.start, end: iso(TODAY), total: b.total, kind, transfers: b.transfers });
  state.expenses.forEach(e => { if (!e.is_cleared) e.is_cleared = true; });
  state.period = { id: state.period.id + 1, start: iso(TODAY) };
  save();
  const lines = b.transfers.map(t => `${user(t.from).name} ← ${user(t.to).name}: ${money(t.amount)}`).join(' · ');
  if (kind === 'monthly') toast('monthly', `סיכום חודשי: ${lines || 'אין העברות'}`, '🔔 סיכום כספי חודשי (31 בחודש)');
  else toast(null, `התקופה נסגרה ונפתחה תקופת קיזוז חדשה. ${lines}`, 'איפוס מלא בוצע');
}

function roundRobin() {
  const ts = tenants();
  const pending = state.tasks.filter(t => t.status === 'Pending').sort((a, b) => a.due_date.localeCompare(b.due_date));
  pending.forEach(t => { t.assigned_to_user_id = ts[state.rrIndex % ts.length].user_id; t.mode = 'Auto'; state.rrIndex++; });
  save();
  toast(null, `${pending.length} משימות שובצו בסבב בין ${ts.map(u => u.name).join(', ')}.`, 'שיבוץ אוטומטי');
}
function remind(when) {
  const pending = state.tasks.filter(t => t.status === 'Pending' && t.due_date <= iso(TODAY));

}

/* ---------- matchmaking ---------- */
function scoreListing(l, p) {
  const priceS = l.price <= p.budget ? 100 : Math.max(0, Math.round(100 - ((l.price - p.budget) / p.budget) * 250));
  const days = Math.abs((new Date(l.entry_date) - new Date(p.entry)) / 86400000);
  const dateS = Math.max(0, Math.round(100 - days * 2.5));
  const areaS = !p.area || l.area === p.area ? 100 : 40;
  const roomsS = l.rooms >= p.rooms ? 100 : 50;
  const total = Math.round(priceS * 0.45 + dateS * 0.25 + areaS * 0.2 + roomsS * 0.1);
  return { total, priceS, dateS, areaS };
}
function passesHard(l, p) {
  const h = l.hard_constraints_json, r = [];
  if (p.hard.noSmoking && h.smoking) r.push('מותר עישון');
  if (p.hard.pets && !h.pets) r.push('בלי חיות מחמד');
  if (p.hard.parking && !h.parking) r.push('אין חניה');
  if (p.type === 'whole' && l.publisher_type !== 'Landlord') r.push('חדר בדירת שותפים');
  if (p.type === 'room' && l.publisher_type !== 'Tenants') r.push('דירה שלמה');
  return r;
}
function feed() {
  const p = state.prefs, shown = [], hidden = [];
  state.listings.filter(l => !l.closed).forEach(l => { const fail = passesHard(l, p); if (fail.length) hidden.push({ l, fail }); else shown.push({ l, s: scoreListing(l, p) }); });
  shown.sort((a, b) => (b.l.premium - a.l.premium) || (b.s.total - a.s.total));
  return { shown, hidden };
}

/* ---------- AI agents (rule-based, in-browser) ---------- */
function guessCategory(t) {
  if (/ניקוי|סבון|אקונומיקה|ספוג|כביסה|מרכך|נוזל כלים/.test(t)) return 'חומרי ניקוי';
  if (/חלב|לחם|סופר|אוכל|קפה|ירקות|פירות|ביצים|קניות/.test(t)) return 'מזון וקניות';
  if (/נורה|ציוד|כלים|מגב|סיר|מחבת|וילון|מטאטא/.test(t)) return 'ציוד לבית';
  if (/חשמל|מים|גז|אינטרנט|ארנונה/.test(t)) return 'חשבונות';
  return 'אחר';
}
function detectExpenseIntent(text) {
  const num = text.match(/(\d+(?:[.,]\d{1,2})?)/);
  if (!num) return null;
  if (!/(קניתי|שילמתי|הוצאתי|קנינו|שילמנו|הזמנתי|עלה|עלו|₪|ש"ח|שח|שקל)/.test(text)) return null;
  return { amount: parseFloat(num[1].replace(',', '.')), category: guessCategory(text), description: text.slice(0, 60) };
}
function internalAgent(text) {
  const intent = detectExpenseIntent(text);
  if (intent && intent.amount > 0) {
    return { kind: 'proposal', content: 'זיהיתי הוצאה. לרשום אותה במאזן?', data: { ...intent, payer: me() }, status: 'pending' };
  }
  if (/(משימ|תורנ|מה פתוח|מה נשאר|מטל)/.test(text)) {
    const p = state.tasks.filter(t => t.status === 'Pending' && t.due_date <= iso(TODAY));
    const done = state.tasks.filter(t => t.status === 'Done').length;
    return { kind: 'text', content: p.length ? `פתוח להיום: ${p.map(t => `${t.title} (${t.assigned_to_user_id ? user(t.assigned_to_user_id).name : 'לא משובץ'})`).join(', ')}. סה״כ ${done} משימות בוצעו.` : 'אין משימות פתוחות להיום. כל הכבוד!' };
  }
  if (/(מאזן|חייב|קיזוז|כמה אני|מי מעביר)/.test(text)) {
    const b = balance();
    return { kind: 'text', content: b.transfers.length ? 'מצב ביניים: ' + b.transfers.map(t => `${user(t.from).name} ← ${user(t.to).name} ${money(t.amount)}`).join(' · ') : 'כולם מאוזנים כרגע.' };
  }
  return null; // regular chat message, the agent stays quiet
}
function listingAgent(l, text) {
  const info = l.public_info, h = l.hard_constraints_json;
  if (/(טלפון|כתובת מדויקת|מספר בית|שם המשכיר|חוזה|ערבות|ביטחונות|הנחה|להוריד במחיר)/.test(text)) return { handoff: true, content: 'זה מידע שלא פורסם במודעה. העברתי את השאלה למפרסם, והתשובה תגיע כאן בצ׳אט.' };
  if (/(מחיר|עולה|שכירות|כמה)/.test(text)) return { content: `המחיר המפורסם הוא ${money(l.price)} לחודש. ${info.extras}` };
  if (/(כניסה|תאריך|מתי|פנוי)/.test(text)) return { content: `תאריך הכניסה המתוכנן: ${fmtDate(l.entry_date)}.` };
  if (/(חיות|כלב|חתול)/.test(text)) return { content: h.pets ? 'כן, מותר להכניס חיות מחמד.' : 'לצערי אין אפשרות לחיות מחמד בדירה הזו.' };
  if (/(עישון|מעשנ)/.test(text)) return { content: h.smoking ? 'מותר לעשן בדירה.' : 'הדירה מיועדת ללא מעשנים.' };
  if (/(חניה|חנייה|רכב)/.test(text)) return { content: h.parking ? 'יש חניה צמודה.' : 'אין חניה צמודה.' };
  if (/(שותפ|מי גר|אווירה)/.test(text)) return { content: info.roommates };
  if (/(ריהוט|מרוהט|רהיט|מיטה)/.test(text)) return { content: info.furniture };
  if (/(קומה|מעלית)/.test(text)) return { content: info.floor };
  if (/(ארנונה|ועד|חשבונות|חשמל)/.test(text)) return { content: info.extras };
  return { handoff: true, content: 'אין לי תשובה מוכנה לשאלה הזו. העברתי אותה למפרסם לסינון אנושי.' };
}
function pushMsg(channel, sender_id, content, extra = {}) {
  const m = { message_id: newId('m'), channel, sender_id, content, timestamp: Date.now(), kind: 'text', ...extra };
  state.messages.push(m); save(); return m;
}

function viewTenantTasks() {
  const auto = state.taskMode === 'Auto';
  const sorted = [...state.tasks].sort((a, b) => (a.status === 'Done') - (b.status === 'Done') || a.due_date.localeCompare(b.due_date));
  const today = state.tasks.filter(t => t.due_date <= iso(TODAY));
  const doneToday = today.filter(t => t.status === 'Done').length;
  return `<main>
    <h2>משימות ותורנויות</h2>
    <div class="card">
      <div class="seg"><button class="${auto ? 'on' : ''}" data-act="taskMode" data-mode="Auto">סבב אוטומטי</button><button class="${auto ? '' : 'on'}" data-act="taskMode" data-mode="Free">בחירה חופשית</button></div>
      <p class="small muted" style="margin:10px 0">${auto ? 'המשימות הפתוחות משובצות בסבב (Round-Robin) בין כל השותפים.' : 'כל אחד בוחר משימות פנויות ומשבץ את עצמו.'}</p>
      ${auto ? '<button class="btn ghost block" data-act="roundRobin">שיבוץ מחדש בסבב</button>' : ''}
    </div>
    <div class="card">
      <div class="spread"><h3 style="margin:0">סטטוס יומי</h3><span class="pill ${doneToday === today.length ? 'ok' : 'warn'}">${doneToday}/${today.length} בוצעו</span></div>
      <div class="bar" style="margin-top:10px"><i style="width:${today.length ? (doneToday / today.length) * 100 : 100}%"></i></div>
      <div class="grid2" style="margin-top:12px"><button class="btn line sm" data-act="remind" data-when="morning">סימולציה: תזכורת בוקר</button><button class="btn line sm" data-act="remind" data-when="evening">סימולציה: תזכורת ערב</button></div>
    </div>
    <div class="card">
      <h3>כל המשימות</h3>
      <ul class="list">${sorted.map(t => {
        const mine = t.assigned_to_user_id === me(), late = t.status === 'Pending' && t.due_date < iso(TODAY);
        return `<li class="task ${t.status === 'Done' ? 'done' : ''}">
          <button class="check ${t.status === 'Done' ? 'on' : ''}" data-act="toggleTask" data-id="${t.task_id}" aria-label="סימון כבוצע">${t.status === 'Done' ? '✓' : ''}</button>
          <div class="grow"><div class="t-title"><b>${esc(t.title)}</b></div>
            <div class="small muted">${t.due_date === iso(TODAY) ? 'היום' : fmtDate(t.due_date)} · ${t.assigned_to_user_id ? esc(user(t.assigned_to_user_id).name) : '<span class="pill gray">פנויה</span>'}${late ? ' · <span class="pill danger">באיחור</span>' : ''}</div></div>
          ${!auto && t.status === 'Pending' ? (t.assigned_to_user_id ? (mine ? `<button class="btn line sm" data-act="releaseTask" data-id="${t.task_id}">שחרור</button>` : '') : `<button class="btn sm" data-act="claimTask" data-id="${t.task_id}">שיבוץ אליי</button>`) : ''}
        </li>`; }).join('')}</ul>
      <details style="margin-top:10px"><summary>משימה חדשה</summary>
        <form data-form="task" class="row" style="margin-top:8px"><input name="title" type="text" placeholder="שם המשימה" required aria-label="שם המשימה" class="grow"><input name="due" type="date" value="${iso(TODAY)}" style="width:140px" aria-label="תאריך"><button class="btn sm">הוספה</button></form>
      </details>
    </div>
  </main>`;
}

function chatView(channel, { placeholder, chips = [], canPost = true, title = '' } = {}) {
  const msgs = state.messages.filter(m => m.channel === channel);
  return `<div class="chat">
    ${title}
    <div class="chat-log" id="chatlog">${msgs.map(msgHtml).join('') || '<div class="msg sys">אין עדיין הודעות.</div>'}</div>
    ${chips.length ? `<div class="chips">${chips.map(c => `<button class="chip" data-act="chip" data-text="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}
    ${canPost ? `<form class="chat-form" data-form="chat" data-channel="${channel}"><input name="text" type="text" placeholder="${placeholder || 'הודעה...'}" autocomplete="off" required aria-label="הודעה"><button class="btn">שליחה</button></form>` : ''}
  </div>`;
}
function msgHtml(m) {
  const isMe = m.sender_id === me(), ai = m.sender_id === 'ai';
  let body = esc(m.content);
  if (m.kind === 'proposal') {
    const d = m.data;
    body += `<div class="proposal"><div class="spread"><b>${money(d.amount)}</b><span class="pill ai">${esc(d.category)}</span></div>
      <div class="small muted">${esc(d.description)} · שילם/ה: ${esc(user(d.payer).name)}</div>
      ${m.status === 'pending' ? `<div class="grid2" style="margin-top:8px"><button class="btn ok sm" data-act="approveExp" data-id="${m.message_id}">אישור ורישום</button><button class="btn line sm" data-act="cancelExp" data-id="${m.message_id}">ביטול</button></div>`
        : `<div class="small" style="margin-top:6px">${m.status === 'approved' ? '✓ נרשם במאזן' : '✕ בוטל, לא נרשם'}</div>`}</div>`;
  }
  if (m.kind === 'handoff') body += `<div class="small" style="margin-top:4px"><span class="pill warn">הועבר לסינון אנושי</span></div>`;
  return `<div class="msg ${isMe ? 'me' : ''} ${ai ? 'ai' : ''}">${isMe ? '' : `<div class="who">${ai ? '✦ סוכן AI' : esc(user(m.sender_id).name)}</div>`}${body}<div class="time">${fmtTime(m.timestamp)}</div></div>`;
}

// The route lives in memory and is mirrored to the URL hash when the page allows it

let route = location.hash.replace(/^#\/?/, '');
function go(path) {
  route = path;

  render();
}
function render() {
  ensureDemoTours();
  const s = state.session;
  const parts = route.split('/');
  let html;
  if (!s.logged) { html = header() + viewLogin(); }
  else if (!s.role) { html = header() + viewRole(); }
  else if (parts[0] === 'settings') { html = header() + viewSettings(); }
  else {
    const role = s.role;
    let tab = parts[0] === role ? parts[1] : null;
    if (!VIEWS[role + '/' + tab]) { go(role + '/' + TABS[role][0][0]); return; }
    html = header() + VIEWS[role + '/' + tab](parts[2]) + nav(role, tab);
  }
  const keepScroll = render.lastRoute === route ? window.scrollY : 0;
  document.getElementById('app').innerHTML = html;
  render.lastRoute = route;

}

let fxEnd = 0, fxRunning = false;
function fireworks(ms) {
  // a show already running just gets longer, so two quick deals never fight over the canvas
  fxEnd = Math.max(fxEnd, performance.now() + ms); if (fxRunning) return;
  const c = document.getElementById('fx'); if (!c || !c.getContext) return;
  const ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr; c.hidden = false; fxRunning = true;
  const COLORS = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb', '#ff9100', '#ffffff'];
  const rockets = [], sparks = []; let next = 0;
  const launch = () => rockets.push({ x: W * (.15 + Math.random() * .7), y: H, vy: -(H * (.016 + Math.random() * .006)), ty: H * (.15 + Math.random() * .3), col: COLORS[Math.random() * COLORS.length | 0] });
  const burst = r => { const n = 60 + (Math.random() * 40 | 0), sp = 3 + Math.random() * 3;
    for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n, v = sp * (.5 + Math.random() * .5) * dpr; sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col: Math.random() < .2 ? '#fff' : r.col }); } };
  (function frame(t) {
    if (t < fxEnd && t > next) { launch(); if (Math.random() < .4) launch(); next = t + 280 + Math.random() * 320; }
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = rockets.length - 1; i >= 0; i--) { const r = rockets[i]; r.y += r.vy; r.vy *= .985;
      ctx.fillStyle = r.col; ctx.beginPath(); ctx.arc(r.x, r.y, 2.5 * dpr, 0, 7); ctx.fill();
      if (r.y <= r.ty || r.vy > -1) { burst(r); rockets.splice(i, 1); } }
    for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.x += p.vx; p.y += p.vy; p.vx *= .97; p.vy = p.vy * .97 + .06 * dpr; p.life -= .014;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = p.life; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 2 * dpr, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;

}
let audioCtx = null;
function playApplause(sec) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    audioCtx = audioCtx || new AC(); if (audioCtx.state === 'suspended') audioCtx.resume();
    const sr = audioCtx.sampleRate, len = Math.floor(sr * sec), buf = audioCtx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      // a crowd of clappers: each clap is a short burst of decaying noise; the crowd swells in, then fades out
      for (let k = 0; k < 18; k++) {
        let t = Math.random() * .25; const rate = 3.2 + Math.random() * 2.2, gain = .25 + Math.random() * .35;
        while (t < sec - .05) {
          const env = Math.min(1, t / .5) * Math.min(1, (sec - t) / 1.4);
          const s0 = Math.floor(t * sr), n = Math.floor(sr * (.012 + Math.random() * .01));
          for (let i = 0; i < n && s0 + i < len; i++) d[s0 + i] += (Math.random() * 2 - 1) * gain * env * Math.exp(-i / (n / 4));
          t += 1 / rate * (.8 + Math.random() * .4);
        }
      }
    }

    const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = .6;

    src.connect(bp).connect(g).connect(audioCtx.destination); src.start();
  } catch (e) { /* audio blocked: the fireworks still play */ }
}

const FORMS = {
  async tourAdd(f, fd) {
    const lid = f.dataset.id, file = fd.get('file'), name = (fd.get('name') || '').trim();

    openModal(`<h2>מעבד את ${video ? 'הסרטון' : 'התמונה'}</h2><p class="small muted">${video ? 'מחלץ פריימים מהסרטון כדי שאפשר יהיה ללכת בו קדימה ואחורה...' : 'בודק אם זו פנורמה ומכין את התמונה...'}</p><div class="bar"><i id="tprog" style="width:0%"></i></div>`);
    try {
      const res = await processUpload(file, p => { const b = document.getElementById('tprog'); if (b) b.style.width = Math.round(p * 100) + '%'; });
      addTourRoom(lid, name, res);
      if (TV.lid === lid) TV.lid = null;
      closeModal(); toast(null, `"${name}" נוסף לסיור (${ROOM_KIND[res.kind]}).`, 'החדר נוסף'); render();
    } catch (err) {
      closeModal(); toast(null, 'לא הצלחנו לעבד את הקובץ. נסו תמונת JPG או PNG, או סרטון MP4.', 'שגיאה בעיבוד');
    }
  },
  login(f, fd) { state.session.logged = true; state.session.name = (fd.get('name') || '').trim(); save(); go('role'); },
  async expense(f, fd) {
    const amount = parseFloat(fd.get('amount')); if (!(amount > 0)) return;
    addExpense({ amount, category: fd.get('category'), description: fd.get('description').trim(), payer: fd.get('payer'), date: fd.get('date'), receipt: await readFile(fd.get('receipt')) });
    render();
  },
  task(f, fd) { state.tasks.push({ task_id: newId('k'), apartment_id: apt().apartment_id, assigned_to_user_id: state.taskMode === 'Auto' ? tenants()[state.rrIndex++ % tenants().length].user_id : null, title: fd.get('title').trim(), due_date: fd.get('due') || iso(TODAY), status: 'Pending', mode: state.taskMode }); save(); render(); },
  async issue(f, fd) {
    state.issues.unshift({ issue_id: newId('i'), apartment_id: apt().apartment_id, reported_by_user_id: me(), title: fd.get('title').trim(), description: fd.get('description').trim(), image: await readFile(fd.get('image')), status: 'Open', receipt_url: null, date: iso(TODAY) });
    save(); toast(null, 'הדיווח נשלח למשכירה ומופיע אצלה בלשונית התקלות.', 'תקלה דווחה'); render();
  },
  deal(f, fd) {
    const l = state.listings.find(x => x.listing_id === f.dataset.id); if (!l || l.closed) return;
    const name = fd.get('name').trim(); if (!name) return;
    l.closed = { name, start: fd.get('start') || l.entry_date, date: iso(TODAY) };
    save(); closeModal(); render();
    celebrate(`${l.title} הושכרה ל${name}`);
    toast(null, 'המודעה הוסרה מפיד המחפשים.', 'העסקה נסגרה');
  },
  async bill(f, fd) {
    state.bills.unshift({ bill_id: newId('b'), apartment_id: apt().apartment_id, title: fd.get('title').trim(), amount: parseFloat(fd.get('amount')), due_date: fd.get('due'), file: await readFile(fd.get('file')), status: 'open' });
    save(); toast(null, 'החשבון מופיע אצל השוכרים בלשונית "הדירה".', 'החשבון הועלה'); render();
  },
  prefs(f, fd) {
    state.prefs = { area: fd.get('area'), budget: parseFloat(fd.get('budget')) || 0, rooms: parseInt(fd.get('rooms')) || 1, entry: fd.get('entry'), type: fd.get('type'), hard: { noSmoking: !!fd.get('hard_noSmoking'), pets: !!fd.get('hard_pets'), parking: !!fd.get('hard_parking') } };
    save();
    const good = feed().shown.filter(x => x.s.total >= 80).length;
    toast('match', good ? `נמצאו ${good} דירות עם התאמה של 80% ומעלה.` : 'אין כרגע דירות עם התאמה גבוהה. נעדכן כשתתפרסם אחת.', '🔔 התאמת דירה');
    go('seeker/feed');
  },
  chat(f, fd) {
    const text = (fd.get('text') || '').trim(); if (!text) return;
    const ch = f.dataset.channel;
    pushMsg(ch, me(), text);
    if (ch === 'internal') {
      const r = internalAgent(text);
      if (r) pushMsg('internal', 'ai', r.content, r.kind === 'proposal' ? { kind: 'proposal', data: r.data, status: 'pending' } : {});
    } else if (ch === 'landlord') {
      toast('messages', `${user(me()).name}: ${text}`, state.session.role === 'landlord' ? '🔔 נשלחה התראה לשוכרים' : '🔔 נשלחה התראה למשכירה');
    } else if (ch.startsWith('listing:') && state.session.role === 'seeker') {
      const l = state.listings.find(x => 'listing:' + x.listing_id === ch);
      const r = listingAgent(l, text);
      setTimeout(() => { pushMsg(ch, 'ai', r.content, r.handoff ? { kind: 'handoff' } : {}); if (r.handoff) toast('messages', `שאלה ממועמד הועברה אל ${l.publisher_name}`, '🔔 הודעה חדשה למפרסם'); render(); }, 450);
    }
    render();
    const input = document.querySelector('form.chat-form input'); if (input) input.focus();
  },
};
const CHANGES = {
  switchRole(el) { const r = el.value; state.session.role = r; state.session.user_id = DEFAULT_USER[r]; save(); go(r + '/' + TABS[r][0][0]); },
  switchUser(el) { state.session.user_id = el.value; save(); render(); },
  issueStatus(el) { const i = state.issues.find(x => x.issue_id === el.dataset.id); i.status = el.value; save(); toast(null, `"${i.title}" – ${ISSUE_STATUS[i.status][0]}. השוכרים רואים את העדכון.`, 'סטטוס עודכן'); render(); },
  async issueReceipt(el) { const i = state.issues.find(x => x.issue_id === el.dataset.id); i.receipt_url = await readFile(el.files[0]); save(); render(); },
  notif(el) { state.notif[el.dataset.k] = el.checked; save(); },
};
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href').slice(2)); window.scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el, e); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form](f, new FormData(f)); });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  // SVG nodes (the tour minimap) act as buttons from the keyboard too
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('svg [role=button][data-act]')) { e.preventDefault(); ACTIONS[e.target.dataset.act](e.target, e); }
});

render();
</script>
</body>
</html>
